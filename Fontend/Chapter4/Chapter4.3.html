/* box model bao gồm : padding - phần tách giữa nội dung và border 
- content - phần chưa nội dunh của box 
- border - phần viền bao quanh box
- margin - phần tách giữa các box với nhau



border - kích cỡ , kiểu , màu -> dotted (viền chấm chấm) , dashed (viền gạch ngang) , solid (viền liền nét) 
, double (viền đôi) , groove (viền rãnh) , ridge (viền nổi) , inset (viền chìm )
 , outset (viền nổi ) , none (không có viền ) , hidden (giống none nhưng không cho phép hiển thị khi dùng bảng )

paddding - cũng có padding top , padding-bottom , padding-left , padding-right
margin - cũng có margin-top , margin-bottom , margin-left , margin-right


 */
       }
