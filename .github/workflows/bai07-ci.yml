name: Bai07 CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "TranDucManh_25020258_Week9/Bai07/**"
      - ".github/workflows/bai07-ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "TranDucManh_25020258_Week9/Bai07/**"
      - ".github/workflows/bai07-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test Bai07
        working-directory: TranDucManh_25020258_Week9/Bai07
        run: mvn -B test
