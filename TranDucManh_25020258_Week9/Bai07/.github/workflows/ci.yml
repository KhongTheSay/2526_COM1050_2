name: CI Automated Code Review Bai7

on:
  push:
    branches: [ main ]
  # Trigger quan trọng của Bài 7
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Bước chạy Checkstyle
      - name: Run Checkstyle
        run: mvn checkstyle:check
        working-directory: Bai07 # Thay đổi theo thư mục bài của bạn

      # Action tự động bình luận vào Pull Request nếu có lỗi (Inline Feedback)
      - name: Checkstyle Review
        uses: dbelyaev/action-checkstyle@master
        if: failure() # Chỉ chạy bước này nếu bước Checkstyle ở trên bị lỗi
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: warning