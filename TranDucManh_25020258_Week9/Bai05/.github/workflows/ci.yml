
name: CI JaCoCo Enforcement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        # Lấy mã nguồn từ repository về máy ảo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Verify with JaCoCo
        # mvn verify sẽ:
        # - Compile source code
        # - Chạy unit tests
        # - Tạo báo cáo JaCoCo
        # - Kiểm tra ngưỡng coverage
        run: mvn -B verify

      - name: Upload JaCoCo Report
        # Chỉ upload một lần từ Ubuntu để tránh trùng lặp artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
